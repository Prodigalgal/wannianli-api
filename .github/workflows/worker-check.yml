name: Cloudflare Worker check

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "src/**"
      - "tools/**"
      - "docs/sources/**"
      - ".gitattributes"
      - "build.gradle"
      - "gradle/**"
      - ".github/workflows/worker-check.yml"
  pull_request:
    paths:
      - "worker/**"
      - "src/**"
      - "tools/**"
      - "docs/sources/**"
      - ".gitattributes"
      - "build.gradle"
      - "gradle/**"
      - ".github/workflows/worker-check.yml"

permissions:
  contents: read

jobs:
  check:
    name: Test and dry-run Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit build dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Test
        run: |
          npm run check:sources
          npm test

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Build and compare Java and Worker public contracts
        working-directory: .
        run: |
          ./gradlew test bootJar --no-daemon
          node tools/compare-implementations.mjs
