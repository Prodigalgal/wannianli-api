name: Cloudflare Worker check

on:
  push:
    paths:
      - "worker/**"
      - ".github/workflows/worker-check.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker-check.yml"

permissions:
  contents: read

jobs:
  check:
    name: Test and dry-run Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run
